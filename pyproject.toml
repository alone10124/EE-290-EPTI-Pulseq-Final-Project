[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrtools"
version = "0.1.0"
description = "EPI pulse sequence design, KomaMRI simulation, and reconstruction tools (EE 290 final project)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pypulseq>=1.5",
    "komamripy",
    "sigpy",
]

[project.optional-dependencies]
dev = ["pytest"]
gpu = ["cupy-cuda12x"]   # NVIDIA only; SigPy uses CuPy for GPU arrays

[tool.setuptools.packages.find]
include = ["mrtools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
