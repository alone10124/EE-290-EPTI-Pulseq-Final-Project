[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epti"
version = "0.1.0"
description = "EPTI pulse sequence, KomaMRI simulation, and reconstruction in Python (EE 290 final project)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pypulseq>=1.5",
    "komamripy",
    "sigpy",
    "pygrappa",
    "ismrmrd",
    "h5py",
    "nibabel",
    "pyyaml",
    "scikit-image",
]

[project.optional-dependencies]
dev = ["pytest"]
gpu = ["cupy-cuda12x"]   # NVIDIA only; SigPy uses CuPy for GPU arrays

[tool.setuptools.packages.find]
include = ["epti*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # MATLAB Pulseq writes file format 1.5.1 and PyPulseq 1.5.0 warns when reading it. The MATLAB-parity tests are what
    # show it parses correctly (every waveform, ADC time, RF event, definition and label matches).
    "ignore:File version 1.5.1 is higher than installed package version:UserWarning",
]
