# Small simulation subset of epti_3mm_ge.yaml: one SMS slice group (the two slices at +-31.5 mm) and two dynamics.
# Geometry, readout, timing and TR are unchanged; the other 20 slice groups are simply not played.
# The calibration scan automatically plays the same two slices (make_epti.py fills in calib.slice_positions).
hardware:
  profile: ge_mr750w
  max_slew: 100.0
imaging:
  esp: 0.600e-3
  blip_dur: 0.168e-3
  tr: 2.0
  slice_groups: [10]      # spatial group index 0..20; group 10 is centered at z = 0 and excites z = +-31.5 mm
  n_dynamics: 2
calib:
  esp: 0.600e-3
  blip_dur: 0.168e-3
  rf_dur: 2.048e-3
