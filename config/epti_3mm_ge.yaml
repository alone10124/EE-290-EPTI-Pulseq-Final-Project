# EPTI P1 protocol (2D SMS single-shot EPTI, 3 mm iso, 42 slices, MB=2) made legal for a GE MR750w (pge2).
#
# Changes from the MGH original, and why (checked with `python sequences/scripts/make_epti.py config/epti_3mm_ge.yaml`):
#   esp 490 -> 600 us        490 us is off GE's 4 us gradient raster and inside the default forbidden echo-spacing
#                            band (410-510 us). Longer echo spacing also lowers PNS (shorter readout ramps).
#   max_slew 120 -> 100 T/m/s   readout lobes and blips ramp at this slew. At 120 T/m/s the GE PNS model (XRMW) gives
#                            80.3-80.5%, just over the 80% "normal mode" limit; 100 T/m/s gives 78.3-78.5%.
#   blip_dur 120 -> 168 us   the largest ky blip (6 lines) needs 168 us at 100 T/m/s.
#   tr 1.8 -> 2.0 s          21 slice groups x 92.9 ms no longer fit in 1.8 s with the longer echo train.
#   calib rf_dur 2.05 -> 2.048 ms   the slice-select plateau must be on the 4 us raster.
#   calib esp/blip_dur = imaging values   the odd/even ghost correction is measured on the calibration navigators and
#                            applied to the imaging data, so both scans must use the same readout lobe and ADC.
# Net effect: TE (center of the echo train) 34.4 -> 41.5 ms.
# The ge_mr750w limits (33 mT/m, 120 T/m/s) and the forbidden ESP band come from TOPPE's tables: confirm them (and the
# scanner's epiesp*.dat) with the scanner facility.
hardware:
  profile: ge_mr750w
  max_slew: 100.0
imaging:
  esp: 0.600e-3
  blip_dur: 0.168e-3
  tr: 2.0
calib:
  esp: 0.600e-3
  blip_dur: 0.168e-3
  rf_dur: 2.048e-3
